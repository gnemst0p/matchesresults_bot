<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d12" />
  <meta name="description" content="Результаты и расписание матчей Dota 2 и CS2 — в одном месте." />
  <title>GG Live — киберспорт в реальном времени</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/details.css" />
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="GG Live — главная"><span class="brand-mark">GG<span>.</span></span><span class="brand-caption">LIVE SCORE</span></a>
      <div class="header-right"><span class="clock" id="local-clock">--:--</span><span class="avatar" id="avatar">G</span></div>
    </header>

    <section class="hero">
      <div class="hero-copy"><div class="eyebrow"><span class="live-pulse"></span> КИБЕРСПОРТ СЕГОДНЯ</div><h1>Каждый раунд.<br/><em>Каждая карта.</em></h1><p>Матчи Dota 2 и CS2 — здесь и сейчас.</p></div>
      <div class="hero-stamp"><span>MATCH</span><strong>GG<br/>LIVE</strong><i>NOW</i></div>
      <div class="hero-lines" aria-hidden="true"></div>
    </section>

    <section class="toolbar" aria-label="Фильтры матчей">
      <div class="game-tabs" role="tablist" aria-label="Игра">
        <button class="game-tab active" data-game="all" role="tab" aria-selected="true">Все игры</button>
        <button class="game-tab" data-game="dota2" role="tab" aria-selected="false"><span class="game-symbol dota">◈</span>Dota 2</button>
        <button class="game-tab" data-game="cs2" role="tab" aria-selected="false"><span class="game-symbol cs">⌖</span>CS2</button>
      </div>
      <button class="refresh" id="refresh" aria-label="Обновить матчи"><span>↻</span><span class="refresh-label">Обновить</span></button>
    </section>

    <nav class="status-tabs" aria-label="Раздел матчей">
      <button class="status-tab active" data-status="live"><span class="tab-dot"></span>Сейчас <span class="tab-count" id="live-count">0</span></button>
      <button class="status-tab" data-status="upcoming">Расписание</button>
      <button class="status-tab" data-status="past">Результаты</button>
    </nav>

    <section class="match-section">
      <div class="section-heading"><div><div class="section-kicker" id="date-label">СЕГОДНЯ</div><h2 id="section-title">Идут прямо сейчас</h2></div><span class="updated" id="updated-at">—</span></div>
      <div id="match-list" class="match-list" aria-live="polite"></div>
      <div id="notice" class="notice hidden"></div>
    </section>

    <footer class="footer"><span class="footer-brand">GG<span>.</span> LIVE</span><span>ДАННЫЕ <a href="https://pandascore.co" target="_blank" rel="noreferrer">PANDASCORE</a></span><span class="auto-refresh"><i></i>АВТООБНОВЛЕНИЕ · 60 СЕК</span></footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
